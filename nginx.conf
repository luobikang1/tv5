# Configure proxy cache for Nginx anti-lag strategy
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=VIDEO_CACHE:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Anti-lag static & API caching
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy CORS / CMS Requests
    location /api/proxy {
        proxy_pass http://127.0.0.1:3000; # If local proxy server exists
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Enable caching to reduce origin site reaction lag
        proxy_cache VIDEO_CACHE;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Static assets long caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
